<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fix-It Forward Shop</title>
<link rel="stylesheet" href="styles.css" />
</head>

<body>

<header class="site-header">
<a href="#" class="logo">Fix-It <span>Forward</span></a>

<nav class="nav">
<ul class="nav__list">
<li><a href="#hero">Home</a></li>
<li><a href="#catalog">Catalogue</a></li>
<li><a href="#cart-panel">Cart</a></li>
<li><a href="#footer">Help</a></li>
</ul>
</nav>

<button class="header-cart">
Cart <span class="header-cart__count">0</span>
</button>
</header>

<main>

<section id="hero" class="hero">
<div class="hero__content">
<h1>Broken, But Beautiful Store</h1>
<p>A deliberately imperfect e-commerce experience.</p>
<a href="#catalog" class="btn btn--primary">Start Shopping</a>
</div>
</section>

<!-- FEATURED HOME SECTION -->
<section id="featured-section" class="catalog">

<h2 class="featured-title">Featured Items</h2>

<div id="featured-grid" class="catalog__grid"></div>

</section>

<!-- CATALOGUE SECTION -->
<section id="catalog" class="catalog">

<header class="catalog__header">

<h2>Catalogue</h2>

<div class="catalog__filters">

<label>
Sort by
<select id="sort-select">
<option value="recommended">Recommended</option>
<option value="price-asc">Price: Low to High</option>
<option value="price-desc">Price: High to Low</option>
</select>
</label>

<label>
<input id="search-input" type="search" placeholder="Search products">
</label>

</div>
</header>

<div id="product-grid" class="catalog__grid"></div>

</section>

<!-- PRODUCT TEMPLATE -->

<template id="product-card-template">

<article class="product">

<div class="product__image-wrapper">
<img class="product__image" alt="">
</div>

<div class="product__body">

<h3 class="product__title"></h3>

<p class="product__description"></p>

<div class="product__pricing">
<span class="product__price"></span>
</div>

<div class="product__stock"></div>

</div>

</article>

</template>

</main>

<footer id="footer" class="site-footer">
<p>© <span id="footer-year">2023</span> Fix-It Forward</p>
</footer>

<script src="app.js"></script>

</body>
</html>
